[package]
name = "nimiapp-realm-agent-studio"
version = "0.1.0"
description = "Realm Agent Studio — Owner-facing creation and operation desktop app for user-owned public Realm Agents."
authors = ["Nimi Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
dotenvy = "0.15"
nimi-shell-tauri = "0.1.0"

[dev-dependencies]
tempfile = "3"
