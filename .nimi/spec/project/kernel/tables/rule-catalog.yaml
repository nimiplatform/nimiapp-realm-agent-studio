rules:
  - rule_id: R-RAS-CORE-001
    level: must
    title: 'nimispecprojectkernel-only-normative-productapp-authority'
    statement: '`.nimi/spec/project/kernel/**` is the only normative product/app authority root for Realm Agent Studio; no topic file, conversation note, renderer screenshot, or generated artifact may be promoted into parallel product truth.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-002
    level: must
    title: 'every-implementation-test-governance-check'
    statement: 'Every implementation, test, governance check, and review comment that references a Realm Agent Studio rule MUST cite the `R-RAS-<DOMAIN>-NNN` ID; narrative paraphrase without an ID is not a valid authority citation.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-003
    level: must
    title: 'kernel-rule-changes-require-updating'
    statement: 'Kernel rule changes require updating both the affected kernel document and `tables/rule-catalog.yaml` in the same change; the catalog and the doc set must never diverge.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-004
    level: must_not
    title: 'realm-agent-studio-must-create'
    statement: 'Realm Agent Studio MUST NOT create app-local shadow truth for Realm Agent identity, settings, assets, posts, visibility, or metrics; every public success state must resolve to an admitted Realm, Runtime, or SDK authority owned outside this app spec.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-005
    level: must
    title: 'local-draft-saved-ai-generation'
    statement: 'Local draft saved, AI generation complete, candidate selected, local schedule created, attachment preview resolved, and Runtime output accepted are never substitutes for the corresponding admitted Realm write success.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-006
    level: must_not
    title: 'placeholder-success-synthesized-moderation-success'
    statement: 'Placeholder success, synthesized moderation success, fake return values, renderer-local truth, and zero-fill metrics are forbidden as substitutes for source-backed truth or admitted failure states.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-007
    level: must
    title: 'realm-agent-studio-must-scope'
    statement: 'Realm Agent Studio MUST keep its default owner portfolio scoped to current-authenticated-user MASTER_OWNED Realm Agents. The only admitted WORLD_OWNED surface is the separate Forge-imported system-curation lane for Halliday-owned Forge-imported agents; generic world-created agents, world NPCs, and world maintainer tooling remain out of scope.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-008
    level: must_not
    title: 'studio-must-reuse-creatorworld-maintainerworld-control-surfa'
    statement: 'Studio MUST NOT reuse creator/world-maintainer/world-control surfaces (including `/api/creator/agents`, `/api/agent/dev/my-agents`, `AgentRulesService` world-scoped CRUD, `WorldControlService.worldControlControllerBatchUpsertWorldBindings`, `Updat...'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-009
    level: must_not
    title: 'agentrule-remains-canonical-realm-truth'
    statement: '`AgentRule` remains the canonical Realm truth anchor; raw `AgentRule` CRUD MUST NOT be promoted to the default owner editing UX, and canonical rule review remains deferred until Realm admits a dedicated owner-scoped rule-content read surface.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-010
    level: must_not
    title: 'realm-runtime-access-must-go'
    statement: 'Realm and Runtime access MUST go through `@nimiplatform/sdk`; app code MUST NOT use app-local REST bypasses, app-owned long-lived auth token storage, hardcoded provider/model routing, fake Runtime sessions, or Desktop host impersonation.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-011
    level: must_not
    title: 'runtime-ai-consumption-layer-only'
    statement: 'Runtime is an AI consumption layer only; Runtime MUST NOT own Realm Agent truth, publish authority, moderation, permissions, lifecycle, metrics, or product state.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-012
    level: must
    title: 'realm-agent-studio-implementation-must'
    statement: 'Realm Agent Studio implementation MUST use `nimi-kit` as the visible interaction system and follow the established `apps/parentos` / `apps/desktop` posture for shell, bootstrap, session, navigation, failure states, and SDK client construction; imp...'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-013
    level: must
    title: 'ai-output-must-remain-candidate'
    statement: 'AI output MUST remain candidate material until owner human review accepts it AND the relevant admitted Realm write succeeds; AI generation, candidate selection, local preview, or Runtime acceptance alone are not Realm truth.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-014
    level: must_not
    title: 'runtime-requests-must-receive-only'
    statement: 'Runtime requests MUST receive only admitted public or owner-approved context; Runtime MUST NOT receive private LocalAgent memory, emotion, cognition, local chat transcript, or app-specific memory fragments.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-015
    level: must_not
    title: 'every-typed-contract-source-availability-capability'
    statement: 'Every typed contract, source-availability, capability, permission, attachment-readiness, binding-shape, owner-authority, or admitted-write-owner gap MUST fail closed with a named failure state (per `failure-semantics.md`); fallback that hides cont...'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-CORE-016
    level: must
    title: 'unavailable-count-zero-unavailable-source'
    statement: 'Unavailable count is not zero; unavailable source is a product state, not a default value.'
    doc_ref: project/kernel/core-rules.md
  - rule_id: R-RAS-SCOPE-001
    level: must_not
    title: 'not-general-agent-management-center'
    statement: 'Studio is not a general agent management center.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-002
    level: must_not
    title: 'no-localagent-or-world-or-forge-sources'
    statement: 'Studio does not manage LocalAgent private runtime forks, generic world-created agents, world NPCs, or Forge package sources outside the separate admitted Forge-imported system-curation lane.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-003
    level: must_not
    title: 'owner-led-first-version-depth'
    statement: 'First-version depth is owner-led plus a separate Forge-imported system-curation lane: no invited editors, no team workspace, and no world-owner override over owner-created agents.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-004
    level: required
    title: 'portfolio-scan-fields-shape'
    statement: 'Portfolio scan exposes user-owned Realm Agents with status, selected world, last updated state, and source availability.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-005
    level: required
    title: 'create-realm-agent-required-fields'
    statement: 'Create Realm Agent must include identity, OASIS default world, optional world selection, handle preflight, world preview, and visible public fields before submit.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-006
    level: required
    title: 'settings-input-owner-update-path'
    statement: 'Owner setting updates flow via natural language, structured fields, AI proposal/review, and canonical rule review only when an admitted owner-scoped rule-content read surface exists.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-007
    level: must
    title: 'assets-public-only-after-realm-write'
    statement: 'Visual/media candidates stay app-local and may be marked public only after Realm write succeeds.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-008
    level: required
    title: 'voice-demo-via-runtime-synthesize'
    statement: 'Voice-demo candidates must be generated through Runtime audio.synthesize, with current SDK use via media.tts.synthesize.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-009
    level: required
    title: 'posts-use-canonical-envelope'
    statement: 'Agent-authored Realm posts must use canonical attachment envelope targets with human review, moderation status, and Realm publish result.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-010
    level: required
    title: 'single-app-local-schedule-only'
    statement: 'Studio admits only an app-local single schedule for one human-reviewed local post draft.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-011
    level: required
    title: 'friendcount-from-userlitedto'
    statement: 'friendCount must source from Realm UserLiteDto.friendCount when the field is present.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-012
    level: must
    title: 'follow-parentos-desktop-app-shell-patterns'
    statement: 'App shell, session posture, navigation, loading/failure states, and SDK client construction must follow apps/parentos and apps/desktop patterns.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-013
    level: must
    title: 'use-nimi-kit-and-platform-sdk'
    statement: 'The app must use nimi-kit as the visible interaction system and @nimiplatform/sdk for Realm/Runtime access.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-014
    level: forbidden
    title: 'no-localagent-private-state'
    statement: 'LocalAgent private memory, emotion, cognition, runtime state, or app-specific memory fragments are out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-015
    level: forbidden
    title: 'no-realmagent-direct-chat'
    statement: 'RealmAgent direct chat as a Studio feature is out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-016
    level: forbidden
    title: 'no-world-agent-or-npc-tooling'
    statement: 'Generic world-created agents, world-owned NPCs, non-Forge-imported world agents, and world maintainer tooling are out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-017
    level: forbidden
    title: 'no-forge-blueprint-mapping'
    statement: 'Forge agentBlueprint provenance or package-to-RealmAgent import mapping is out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-018
    level: forbidden
    title: 'no-world-transfer'
    statement: 'World transfer is out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-019
    level: forbidden
    title: 'no-team-collaboration'
    statement: 'Team collaboration, invited editors, shared operation, or workspace roles are out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-020
    level: forbidden
    title: 'no-raw-agentrule-crud-default'
    statement: 'Explicit raw AgentRule CRUD as the default owner-facing editing model is out of scope.'
    doc_ref: project/kernel/product-scope.md
  - rule_id: R-RAS-SCOPE-021
    level: forbidden
    title: 'no-setting-history-or-fork-notify'
